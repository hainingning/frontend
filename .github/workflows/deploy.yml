name: Deploy Frontend Web

on:
  push:
    branches:
      - main
    paths-ignore:
      - ".github/**"

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.1

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Build Frontend
        run: bun run build

      - name: Package Artifacts
        run: |
          cd apps/admin/dist && zip -qr "../../../web_admin_${GITHUB_SHA}.zip" .
          cd ../../../apps/user/dist && zip -qr "../../../web_user_${GITHUB_SHA}.zip" .

      - name: Upload Artifacts to Server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          password: ${{ secrets.SERVER_PASSWORD }}
          source: "web_admin_${{ github.sha }}.zip,web_user_${{ github.sha }}.zip"
          target: "/tmp"

      - name: Deploy on Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            set -eu

            release_sha="${{ github.sha }}"
            web_root="/root/ppanel/web"
            stage_root="${web_root}/.deploy-${release_sha}"
            backup_root="${web_root}/.backup-${release_sha}"
            admin_archive="/tmp/web_admin_${release_sha}.zip"
            user_archive="/tmp/web_user_${release_sha}.zip"

            rm -rf -- "${stage_root}" "${backup_root}"
            mkdir -p "${stage_root}/admin" "${stage_root}/user" "${backup_root}"

            unzip -q "${admin_archive}" -d "${stage_root}/admin"
            unzip -q "${user_archive}" -d "${stage_root}/user"
            test -f "${stage_root}/admin/index.html"
            test -f "${stage_root}/user/index.html"

            admin_backed_up=0
            user_backed_up=0

            if [ -e "${web_root}/admin" ] || [ -L "${web_root}/admin" ]; then
              mv "${web_root}/admin" "${backup_root}/admin"
              admin_backed_up=1
            fi

            if [ -e "${web_root}/user" ] || [ -L "${web_root}/user" ]; then
              if mv "${web_root}/user" "${backup_root}/user"; then
                user_backed_up=1
              else
                if [ "${admin_backed_up}" -eq 1 ]; then
                  mv "${backup_root}/admin" "${web_root}/admin"
                fi
                exit 1
              fi
            fi

            if mv "${stage_root}/admin" "${web_root}/admin" && \
              mv "${stage_root}/user" "${web_root}/user"; then
              rm -rf -- "${backup_root}" "${stage_root}"
              rm -f -- "${admin_archive}" "${user_archive}"
            else
              rm -rf -- "${web_root}/admin" "${web_root}/user"
              if [ "${admin_backed_up}" -eq 1 ]; then
                mv "${backup_root}/admin" "${web_root}/admin"
              fi
              if [ "${user_backed_up}" -eq 1 ]; then
                mv "${backup_root}/user" "${web_root}/user"
              fi
              exit 1
            fi
